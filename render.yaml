# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the Java/Spring Boot API as a web service on the free plan.
# The transactional checkout flow requires MongoDB multi-document transactions,
# so the service needs a MongoDB replica set — e.g. Atlas M10+ or any mongod
# started with `--replSet rs0`. Point DATABASE_URL at it; data persists across
# redeploys (this is the Java port — there is no in-memory demo mode like the
# TypeScript app had).
#
#   render blueprint launch    # first deploy
#   render blueprint apply     # subsequent deploys
#
# The Vercel edge gateway (api/index.ts) keeps the same public URL and proxies
# to this origin, so no Vercel changes are needed.
services:
  - type: web
    name: ecommerce-backend
    runtime: docker
    dockerfilePath: java/Dockerfile
    dockerContext: java
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false # required: MongoDB replica set (transactions), e.g. Atlas M10+
      - key: JWT_ACCESS_SECRET
        sync: false # generate: openssl rand -hex 48
      - key: JWT_REFRESH_SECRET
        sync: false # generate: openssl rand -hex 48
      - key: CORS_ORIGIN
        value: https://your-frontend.example.com
      - key: FRONTEND_URL
        value: https://your-frontend.example.com
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: ACCOUNT_LOCK_MINUTES
        value: "15"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false # generate: openssl rand -hex 32
      - key: PAYMENT_MOCK_AUTO_APPROVE
        value: "true"
      - key: ALLOW_MOCK_AUTO_APPROVE_IN_PRODUCTION
        value: "true" # demo: allows checkout to complete without a real gateway
