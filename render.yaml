# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the API as a web service on the free plan. By default it boots an
# embedded in-memory MongoDB replica set (USE_IN_MEMORY_DB=true) so the demo
# runs with zero external accounts — data resets on every redeploy. Point
# DATABASE_URL at a persistent replica set (e.g. Atlas) to keep data.
#
#   render blueprint launch    # first deploy
#   render blueprint apply     # subsequent deploys
services:
  - type: web
    name: ecommerce-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/core/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3001
      - key: USE_IN_MEMORY_DB
        value: "true" # demo: no external database needed (data is ephemeral)
      - key: DATABASE_URL
        sync: false # optional when USE_IN_MEMORY_DB=true; set for persistence
      - key: JWT_ACCESS_SECRET
        sync: false # generate: openssl rand -hex 48
      - key: JWT_REFRESH_SECRET
        sync: false # generate: openssl rand -hex 48
      - key: CORS_ORIGIN
        value: https://your-frontend.example.com
      - key: FRONTEND_URL
        value: https://your-frontend.example.com
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: ACCOUNT_LOCK_MINUTES
        value: "15"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false # generate: openssl rand -hex 32
      - key: PAYMENT_MOCK_AUTO_APPROVE
        value: "true"
      - key: ALLOW_MOCK_AUTO_APPROVE_IN_PRODUCTION
        value: "true" # demo: allows checkout to complete without a real gateway
