            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [productId, category, unitPriceCents, quantity]
                    properties:
                      productId: { type: string }
                      category: { type: string, nullable: true }
                      unitPriceCents: { type: integer, minimum: 0 }
                      quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Valid with the computed discount
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      valid: { type: boolean, example: true }
                      discountCents: { type: integer }
                      message: { type: string }

