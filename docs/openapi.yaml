        '200': { $ref: '#/components/schemas/Ok' }

  # ---------------------------------------------------------------- Payments
  /payments/checkout:
    post:
      tags: [Payments]
      summary: Create or resume a payment for a pending order
      description: |
        With the mock provider in `PAYMENT_MOCK_AUTO_APPROVE=true` mode, the
        order is confirmed immediately (stock deducted atomically). Otherwise the
        payment stays `created` until the gateway webhook confirms it.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: string }
                provider: { type: string, enum: [mock] }
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      payment: { $ref: '#/components/schemas/Payment' }
                      order: { $ref: '#/components/schemas/Order' }
  /payments/{orderId}:
    get:
      tags: [Payments]
      summary: Get the payment for an order
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Payment' }
  /payments/{orderId}/refund:
    post:
      tags: [Payments]
      summary: Refund an order (ADMIN or SUPPORT)
      description: Restocks the goods and marks the order refunded.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
                amountCents:
                  type: integer
                  description: Partial refunds are supported
      responses:
        '200':
          description: Refund processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      refund: { $ref: '#/components/schemas/Refund' }
                      payment: { $ref: '#/components/schemas/Payment' }
                      order: { $ref: '#/components/schemas/Order' }
  /payments/mock/notify:
    post:
      tags: [Payments]
      summary: Simulate a gateway webhook (ADMIN, dev only)
      description: Emits a signed webhook through the real route so the full HMAC-verified flow is exercised.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, providerReference, amountCents]
              properties:
                type: { type: string, enum: [payment.succeeded, payment.failed, refund.succeeded] }
                providerReference: { type: string }
                amountCents: { type: integer, minimum: 0 }
                reason: { type: string }
      responses:
        '200':
          description: Webhook emitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
  /payments/webhook/{provider}:
    post:
      tags: [Payments]
      summary: Gateway webhook endpoint (no auth, HMAC-signed)
      description: |
        Consumes the **raw** body (before JSON parsing), verifies the
        `x-webhook-signature` HMAC-SHA256 header, deduplicates by webhook id and
        applies the event. Orphan or duplicate events are acknowledged with
        `handled: false` to stop gateway retries.
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [mock] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                type: { type: string, enum: [pay_succeeded, pay_failed, refund_succeeded] }
                object:
                  type: object
                  required: [id]
                  properties:
                    id: { type: string }
                    amount_cents: { type: integer }
                    reason: { type: string }
                refund_reference: { type: string }
      responses:
        '200':
          description: Webhook acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  handled: { type: boolean }
                  duplicate: { type: boolean }
        '401':
          description: Invalid HMAC signature
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- Wishlist
  /wishlist:
    get:
      tags: [Wishlist]
      summary: Get the caller's wishlist
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Wishlist with product details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            product: { $ref: '#/components/schemas/Product' }
                            addedAt: { type: string, format: date-time }
    delete:
      tags: [Wishlist]
      summary: Clear the wishlist
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/schemas/Ok' }
  /wishlist/{productId}:
    post:
      tags: [Wishlist]
      summary: Add a product to the wishlist
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Wishlist updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            productId: { type: string }
                            addedAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Wishlist]
      summary: Remove a product from the wishlist
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/schemas/Ok' }

  # ---------------------------------------------------------------- Reviews
  /products/{productId}/reviews:
    get:
      tags: [Reviews]
      summary: List approved reviews for a product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Paginated reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Review' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [Reviews]
      summary: Create a review (verified purchases auto-approve)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string, maxLength: 120 }
                body: { type: string, maxLength: 5000 }
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Review' }
        '409':
          description: Already reviewed this product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /products/{productId}/reviews/rating:
    get:
      tags: [Reviews]
      summary: Aggregate rating for a product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Rating summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      count: { type: integer }
                      average: { type: number }
  /reviews/{reviewId}:
    patch:
      tags: [Reviews]
      summary: Update the caller's review
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string, maxLength: 120 }
                body: { type: string, maxLength: 5000 }
      responses:
        '200':
          description: Updated review
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Review' }
    delete:
      tags: [Reviews]
      summary: Delete the caller's review
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/schemas/Ok' }
  /admin/reviews:
    get:
      tags: [Reviews]
      summary: Review moderation queue (ADMIN or SUPPORT)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        '200':
          description: Paginated reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Review' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
  /admin/reviews/{reviewId}/moderate:
    patch:
      tags: [Reviews]
      summary: Approve or reject a review (ADMIN or SUPPORT)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject] }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Review moderated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Review' }

  # ---------------------------------------------------------------- Admin
  /admin/dashboard/summary:
    get:
      tags: [Admin]
      summary: Sales and platform summary (ADMIN or SUPPORT)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: Dashboard metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      revenueCents: { type: integer }
                      orders: { type: integer }
                      customers: { type: integer }
                      lowStockItems: { type: integer }
                      pendingReviews: { type: integer }
  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Audit trail (ADMIN only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
        - in: query
          name: event
          schema: { type: string }
        - in: query
          name: actorId
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Paginated audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
  /admin/products/{productId}/performance:
    get:
      tags: [Admin]
      summary: Per-product sales performance (ADMIN or SUPPORT)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Performance metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      unitsSold: { type: integer }
                      revenueCents: { type: integer }
                      averageRating: { type: number }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Validation failed or business rule rejected the request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The authenticated user lacks the required role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Ok:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message: { type: string }
        code:
          type: string
          description: Machine-readable error code (e.g. EMAIL_TAKEN, INVALID_CREDENTIALS, INSUFFICIENT_STOCK)
        errors:
          type: array
          description: Field-level validation issues (present on 400 validation errors)
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        pages: { type: integer }
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthResult:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        roles:
          type: array
          items: { type: string, enum: [CUSTOMER, SELLER, SUPPORT, ADMIN] }
        status: { type: string, enum: [active, suspended, deactivated] }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
    Session:
      type: object
      properties:
        id: { type: string }
        userAgent: { type: string }
        ip: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    Address:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        recipient: { type: string }
        phone: { type: string }
        line1: { type: string }
        line2: { type: string, nullable: true }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string, description: 'ISO 3166-1 alpha-2' }
        isDefault: { type: boolean }
    AddressInput:
      type: object
      required: [label, recipient, line1, city, state, postalCode, country]
      properties:
        label: { type: string, maxLength: 50 }
        recipient: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 30 }
        line1: { type: string, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        state: { type: string, maxLength: 100 }
        postalCode: { type: string, maxLength: 20 }
        country: { type: string, minLength: 2, maxLength: 2 }
    ShippingAddressInput:
      type: object
      required: [fullName, phone, line1, city, state, postalCode, country]
      properties:
        fullName: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 30 }
        line1: { type: string, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        state: { type: string, maxLength: 100 }
        postalCode: { type: string, maxLength: 20 }
        country: { type: string, minLength: 2, maxLength: 2 }
    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        parent: { type: string, nullable: true }
        order: { type: integer }
        isActive: { type: boolean }
    Brand:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        isActive: { type: boolean }
    Stock:
      type: object
      properties:
        quantity: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
        lowStockThreshold: { type: integer }
    ProductVariant:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
        priceCents: { type: integer }
        compareAtPriceCents: { type: integer, nullable: true }
        taxRate: { type: number }
        images:
          type: array
          items: { type: string }
        isActive: { type: boolean }
        stock: { $ref: '#/components/schemas/Stock' }
        inStock:
          type: boolean
          description: Present on storefront detail responses instead of stock
    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        summary: { type: string }
        description: { type: string }
        brand: { type: string, nullable: true }
        category: { type: string, nullable: true }
        images:
          type: array
          items: { type: string }
        specs:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              value: { type: string }
        tags:
          type: array
          items: { type: string }
        status: { type: string, enum: [draft, published, archived] }
        isActive: { type: boolean }
        publishedAt: { type: string, format: date-time, nullable: true }
        variants:
          type: array
          items: { $ref: '#/components/schemas/ProductVariant' }
        minPriceCents: { type: integer, nullable: true }
        inStock: { type: boolean }
        averageRating: { type: number }
        ratingCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [name, variants]
      properties:
        name: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 50000 }
        brand: { type: string, nullable: true }
        category: { type: string, nullable: true }
        images:
          type: array
          items: { type: string, format: uri }
        tags:
          type: array
          items: { type: string }
        status: { type: string, enum: [draft, published, archived] }
        variants:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, priceCents]
            properties:
              sku: { type: string, maxLength: 64 }
              attributes:
                type: object
                additionalProperties: { type: string }
              priceCents: { type: integer, minimum: 0 }
              compareAtPriceCents: { type: integer, minimum: 0, nullable: true }
              taxRate: { type: number, minimum: 0, maximum: 100 }
              quantity: { type: integer, minimum: 0 }
              lowStockThreshold: { type: integer, minimum: 0 }
              images:
                type: array
                items: { type: string, format: uri }
              isActive: { type: boolean }
    ProductUpdate:
      type: object
      description: Partial update; `variants` replaces the full set when provided
      properties:
        name: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 50000 }
        brand: { type: string, nullable: true }
        category: { type: string, nullable: true }
        images:
          type: array
          items: { type: string, format: uri }
        tags:
          type: array
          items: { type: string }
        status: { type: string, enum: [draft, published, archived] }
        variants:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              sku: { type: string, maxLength: 64 }
              attributes:
                type: object
                additionalProperties: { type: string }
              priceCents: { type: integer, minimum: 0 }
              compareAtPriceCents: { type: integer, minimum: 0, nullable: true }
              taxRate: { type: number, minimum: 0, maximum: 100 }
              quantity: { type: integer, minimum: 0 }
              lowStockThreshold: { type: integer, minimum: 0 }
              images:
                type: array
                items: { type: string, format: uri }
              isActive: { type: boolean }
    StockSnapshot:
      type: object
      properties:
        productId: { type: string }
        variantId: { type: string }
        sku: { type: string }
        stock: { $ref: '#/components/schemas/Stock' }
        isLowStock: { type: boolean }
    StockMovement:
      type: object
      properties:
        id: { type: string }
        variantId: { type: string }
        productId: { type: string }
        sku: { type: string }
        type: { type: string, enum: [restock, adjustment, reserve, release, deduction, refund_restock, order_cancel_restock] }
        quantity: { type: integer }
        reason: { type: string }
        reference:
          type: object
          description: Link to the order or actor that caused the movement
          additionalProperties: true
        createdAt: { type: string, format: date-time }
    CartItem:
      type: object
      properties:
        productId: { type: string }
        variantId: { type: string }
        sku: { type: string }
        productName: { type: string }
        productSlug: { type: string }
        image: { type: string, nullable: true }
        attributes:
          type: object
          additionalProperties: { type: string }
        unitPriceCents: { type: integer }
        compareAtPriceCents: { type: integer, nullable: true }
        taxRate: { type: number }
        quantity: { type: integer }
        lineTotalCents: { type: integer }
        available: { type: integer }
    Cart:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        itemCount: { type: integer }
        subtotalCents: { type: integer }
    OrderItem:
      type: object
      properties:
        productId: { type: string }
        variantId: { type: string }
        sku: { type: string }
        name: { type: string }
        image: { type: string, nullable: true }
        attributes:
          type: object
          additionalProperties: { type: string }
        unitPriceCents: { type: integer }
        taxRate: { type: number }
        taxAmountCents: { type: integer }
        discountCents: { type: integer }
        lineTotalCents: { type: integer }
        quantity: { type: integer }
    Order:
      type: object
      properties:
        id: { type: string }
        orderNumber: { type: string, example: ORD-20260815-1A2B3C4D }
        userId: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        subtotalCents: { type: integer }
        discountTotalCents: { type: integer }
        couponCode: { type: string, nullable: true }
        couponDiscountCents: { type: integer }
        taxTotalCents: { type: integer }
        shippingCents: { type: integer }
        totalCents: { type: integer }
        currency: { type: string, default: usd }
        shippingAddress: { $ref: '#/components/schemas/ShippingAddressInput' }
        status: { type: string, enum: [pending, confirmed, processing, packed, shipped, delivered, cancelled, refund_requested, refunded, payment_failed] }
        statusHistory:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              note: { type: string }
              changedBy: { type: string, nullable: true }
              at: { type: string, format: date-time }
        paymentId: { type: string, nullable: true }
        paymentStatus: { type: string, nullable: true }
        stockDeducted: { type: boolean }
        placedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelledReason: { type: string, nullable: true }
        refunds:
          type: array
          items:
            type: object
            properties:
              amountCents: { type: integer }
              reason: { type: string }
              status: { type: string }
              paymentRefundId: { type: string, nullable: true }
              at: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CouponInput:
      type: object
      required: [code, type, value]
      properties:
        code: { type: string, maxLength: 50 }
        type: { type: string, enum: [percentage, fixed] }
        value: { type: number, minimum: 0 }
        scope: { type: string, enum: [all, category, product] }
        productIds:
          type: array
          items: { type: string }
        categoryIds:
          type: array
          items: { type: string }
        minOrderValueCents: { type: integer, minimum: 0 }
        maxDiscountCents: { type: integer, minimum: 0, nullable: true }
        maxUses: { type: integer, minimum: 1, nullable: true }
        perUserLimit: { type: integer, minimum: 1 }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
    Coupon:
      allOf:
        - { $ref: '#/components/schemas/CouponInput' }
        - type: object
          properties:
            id: { type: string }
            usedCount: { type: integer }
            isActive: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        link: { type: string, nullable: true }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    Payment:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        userId: { type: string }
        provider: { type: string }
        providerReference: { type: string }
        amountCents: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [created, succeeded, failed, refunded] }
        refundedCents: { type: integer }
        refunds:
          type: array
          items:
            type: object
            properties:
              amountCents: { type: integer }
              reason: { type: string }
              refundReference: { type: string }
              at: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Refund:
      type: object
      properties:
        refundReference: { type: string }
        amountCents: { type: integer }
        status: { type: string }
    Review:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        userId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        body: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        isVerifiedPurchase: { type: boolean }
        moderationReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
