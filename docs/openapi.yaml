      summary: Get any order (ADMIN or SUPPORT)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Order' }
  /orders/admin/{orderId}/transition:
    post:
      tags: [Orders]
      summary: Advance the fulfillment state machine (ADMIN or SUPPORT)
      description: Valid transitions are `processing → packed → shipped → delivered` and `cancel`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, enum: [processing, packed, shipped, delivered, cancelled] }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Order' }
        '409':
          description: Illegal transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

