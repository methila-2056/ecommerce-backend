openapi: 3.0.3
info:
  title: E-Commerce Backend System API
  version: 1.0.0
  description: |
    Production-grade REST API for an e-commerce platform built with Express, TypeScript
    and MongoDB. Covers authentication with JWT + refresh-token rotation, a full catalog,
    cart, transactional checkout (orders, coupons, payments, inventory), reviews,
    wishlists, notifications, an admin dashboard and a complete audit trail.

    ## Conventions
    - All monetary values are **integer cents** (`priceCents`, `totalCents`, ...).
    - Responses are wrapped in an envelope: `{ success, message, data, meta? }`.
    - Errors return `{ success: false, message, code?, errors? }` with meaningful HTTP
      status codes and a stable machine-readable `code`.
    - Authenticated endpoints accept `Authorization: Bearer <accessToken>`.
    - Refresh tokens travel in an httpOnly, SameSite cookie (not the body).
    - The checkout/payment pipeline requires a MongoDB **replica set** (multi-document
      transactions).
  contact:
    name: Portfolio project
servers:
  - url: http://localhost:3001/api/v1
    description: Local development server
tags:
  - name: Auth
    description: Registration, login, sessions and password flows
  - name: Users
    description: Profile and address management
  - name: Catalog
    description: Storefront search and admin product/category/brand management
  - name: Inventory
    description: Stock movements, restocks, adjustments and low-stock alerts
  - name: Cart
    description: The customer's shopping cart
  - name: Orders
    description: Checkout, lifecycle and staff order management
  - name: Coupons
    description: Admin coupon management and checkout validation
  - name: Notifications
    description: In-app notifications for order/review events
  - name: Payments
    description: Checkout, refunds and gateway webhooks
  - name: Wishlist
    description: Personal product wishlists
  - name: Reviews
    description: Product reviews with verified-purchase moderation
  - name: Admin
    description: Staff dashboard, analytics and audit logs
security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new customer account
      description: Creates an account and issues a verification token. Rate limited (10/15min per IP).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Account created (email verification pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify the email address with the emailed token
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Invalid or expired token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Re-send the email verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Token re-sent (or email hidden if the account does not exist)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and obtain an access token
      description: Issues an access token and sets an httpOnly refresh cookie. Rate limited (20/15min per IP); accounts lock after repeated failures.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token and get a new access token
      description: Reads the httpOnly refresh cookie, validates it, rotates it and re-issues the cookie. Reused (replayed) tokens revoke the whole session family.
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      accessToken: { type: string }
                      accessTokenExpiresAt: { type: string, format: date-time }
        '401':
          description: Missing, invalid or reused refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session and clear the refresh cookie
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/schemas/Ok' }
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke every session for the user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/schemas/Ok' }
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change the account password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: Password changed, other sessions revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset token
      description: Rate limited (5/15min per IP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Reset token emailed if the account exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset the password with the emailed token
      description: Rate limited (10/60min per IP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: Password reset, all sessions revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/sessions:
    get:
      tags: [Auth]
      summary: List active sessions for the user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
  /auth/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Revoke a specific session
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/schemas/Ok' }
        '404':
          description: Session not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user and roles (single source for the frontend)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }

  # ---------------------------------------------------------------- Users
  /users/me:
    get:
      tags: [Users]
      summary: Get the caller's profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }
    patch:
      tags: [Users]
      summary: Update the caller's profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                phone: { type: string, maxLength: 30, nullable: true }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }
  /users/me/addresses:
    get:
      tags: [Users]
      summary: List the caller's addresses
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Address book
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Address' }
    post:
      tags: [Users]
      summary: Add an address
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Address' }
  /users/me/addresses/{id}:
    patch:
      tags: [Users]
      summary: Update an address
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: Updated address
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Address' }
    delete:
      tags: [Users]
      summary: Remove an address
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/schemas/Ok' }
  /users/me/addresses/{id}/default:
    post:
      tags: [Users]
      summary: Mark an address as default
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Default address updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
  /users/me/deactivate:
    post:
      tags: [Users]
      summary: Deactivate the caller's own account
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string }
      responses:
        '200': { $ref: '#/components/schemas/Ok' }
  /users:
    get:
      tags: [Users]
      summary: List users (ADMIN only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: role
          schema: { type: string, enum: [CUSTOMER, SELLER, SUPPORT, ADMIN] }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{id}:
    get:
      tags: [Users]
      summary: Get a user (ADMIN only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }
  /users/{id}/status:
    patch:
      tags: [Users]
      summary: Activate or deactivate a user (ADMIN only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended, deactivated] }
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }
  /users/{id}/roles:
    patch:
      tags: [Users]
      summary: Update a user's roles (ADMIN only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items: { type: string, enum: [CUSTOMER, SELLER, SUPPORT, ADMIN] }
      responses:
        '200':
          description: Roles updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }

  # ---------------------------------------------------------------- Catalog
  /products:
    get:
      tags: [Catalog]
      summary: Search the published catalog
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: keyword
          description: Full-text search across name, summary, description and tags
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: brand
          schema: { type: string }
        - in: query
          name: minPrice
          schema: { type: number, minimum: 0 }
        - in: query
          name: maxPrice
          schema: { type: number, minimum: 0 }
        - in: query
          name: rating
          schema: { type: number, minimum: 1, maximum: 5 }
        - in: query
          name: inStock
          schema: { type: string, enum: ['true', 'false'] }
        - in: query
          name: sort
          schema: { type: string, enum: [newest, oldest, price_asc, price_desc, rating, relevance] }
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
  /products/slug/{slug}:
    get:
      tags: [Catalog]
      summary: Get a published product by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Product' }
        '404':
          description: Product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /products/{id}:
    get:
      tags: [Catalog]
      summary: Get a published product by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product (variants expose `inStock`; stock levels stay hidden)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
  /categories:
    get:
      tags: [Catalog]
      summary: List storefront categories
      responses:
        '200':
          description: Category tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
  /brands:
    get:
      tags: [Catalog]
      summary: List storefront brands
      responses:
        '200':
          description: Brands
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Brand' }
  /admin/products:
    get:
      tags: [Catalog]
      summary: Search all products incl. drafts/inactive (SELLER or ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [draft, published, archived] }
      responses:
        '200':
          description: Paginated products with stock levels
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Catalog]
      summary: Create a product (SELLER or ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: SKU or slug already in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /admin/products/{id}:
    get:
      tags: [Catalog]
      summary: Get a product including stock (SELLER or ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product with stock levels
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Product' }
    patch:
      tags: [Catalog]
      summary: Update a product (SELLER or ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Product' }
    delete:
      tags: [Catalog]
      summary: Archive a product (soft delete)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/schemas/Ok' }
  /admin/products/{id}/status:
    patch:
      tags: [Catalog]
      summary: Transition product status (SELLER or ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [draft, published, archived] }
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
  /admin/categories:
    post:
      tags: [Catalog]
      summary: Create a category (ADMIN only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                parent: { type: string, nullable: true }
                description: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Category' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/categories/{id}:
    patch:
      tags: [Catalog]
      summary: Update a category (ADMIN only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
    delete:
      tags: [Catalog]
      summary: Delete a category (ADMIN only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/schemas/Ok' }
  /admin/brands:
    post:
      tags: [Catalog]
      summary: Create a brand (ADMIN only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Brand created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Brand' }
  /admin/brands/{id}:
    patch:
      tags: [Catalog]
      summary: Update a brand (ADMIN only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/schemas/Ok' }
    delete:
      tags: [Catalog]
