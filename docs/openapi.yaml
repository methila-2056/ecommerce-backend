  # ---------------------------------------------------------------- Orders
  /orders:
    post:
      tags: [Orders]
      summary: Create an order from the cart
      description: |
        Freezes authoritative prices and coupon discounts, then reserves stock and
        creates the order **in a single transaction**. Supply either a saved
        `shippingAddressId` or a full inline `shippingAddress`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shippingAddressId: { type: string }
                shippingAddress: { $ref: '#/components/schemas/ShippingAddressInput' }
                couponCode: { type: string, maxLength: 50 }
      responses:
        '201':
          description: Order created and stock reserved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Order' }
        '400':
          description: Empty cart, invalid coupon or unavailable item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Orders]
      summary: List the caller's orders
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: Paginated orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
  /orders/{orderId}:
