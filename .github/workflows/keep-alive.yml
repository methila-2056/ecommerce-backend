name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl -fsS -o /dev/null -w "status: %{http_code}\n" https://ecommerce-backend-aot3.onrender.com/health
